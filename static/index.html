<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>가계부</title>
  <script>
    // 첫 화면을 그리기 전에 테마를 정한다 (app.js의 applyTheme와 같은 규칙)
    (function () {
      var pref = "system";
      try { pref = localStorage.getItem("ggb.theme") || "system"; } catch (e) {}
      var dark = pref === "dark" || (pref === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%233d5afe'/%3E%3Cpath d='M10.2 21H18.2V43M27.2 21H34.7V43M43.7 21V43H53.8V21M43.7 32H53.8' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <a class="brand" href="#/">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <rect class="lg-bg" width="64" height="64" rx="18"/>
            <path class="lg-ink" d="M10.2 21H18.2V43" pathLength="1"/>
            <path class="lg-ink" d="M27.2 21H34.7V43" pathLength="1"/>
            <path class="lg-ink" d="M43.7 21V43H53.8V21M43.7 32H53.8" pathLength="1"/>
          </svg>
        </span>
        <span class="brand-name">가계부</span>
        <span class="brand-sub">ggb</span>
      </a>
      <nav class="main-nav">
        <span class="nav-ind" aria-hidden="true"></span>
        <a href="#/" data-nav="home">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3 8h14M7 2.5v3M13 2.5v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          월별 가계부
        </a>
        <a href="#/dashboard" data-nav="dash">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16V10M8 16V5M12 16v-7M16 16V3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          대시보드
        </a>
        <a href="#/blocks" data-nav="blocks">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="14" height="6" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="3" y="11" width="6" height="6" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="11" y="11" width="6" height="6" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
          블럭 관리
        </a>
      </nav>
      <a class="new-month-btn" href="#/new">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        새 달 만들기
      </a>
      <nav id="monthNav" class="month-nav"></nav>
      <div class="theme-box">
        <span class="theme-label" id="themeLabel">화면 테마</span>
        <div class="theme-seg" role="group" aria-labelledby="themeLabel">
          <span class="theme-ind" aria-hidden="true"></span>
          <button type="button" data-mode="light" aria-pressed="false">
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.6" fill="currentColor"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            라이트
          </button>
          <button type="button" data-mode="dark" aria-pressed="false">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15.5 12.6A6.5 6.5 0 0 1 7.4 4.5a6.5 6.5 0 1 0 8.1 8.1z" fill="currentColor"/></svg>
            다크
          </button>
          <button type="button" data-mode="system" aria-pressed="false">
            <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 17h6M10 13.5V17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            시스템
          </button>
        </div>
      </div>
    </aside>
    <main id="main"></main>
  </div>
  <dialog id="modal"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/static/dashboard.js"></script>
  <script src="/static/blocks.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
