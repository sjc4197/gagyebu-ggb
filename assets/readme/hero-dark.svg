          fill="#eef1f6">73<tspan font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#a9b1be" dx="8" letter-spacing="0">만원</tspan></text>
    <text class="num n1 loop" x="676" y="194" font-family="Outfit, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-2"
          fill="#eef1f6">28<tspan font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#a9b1be" dx="8" letter-spacing="0">만원</tspan></text>
    <text class="num n2 loop" x="676" y="194" font-family="Outfit, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-2"
