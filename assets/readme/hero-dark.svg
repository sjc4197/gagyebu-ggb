<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" role="img" aria-label="가계부 ggb: 이번 달 고정지출을 체크하고 아직 나갈 돈을 한눈에">
  <style>
  .rise { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
  .d1 { animation-delay: .15s; } .d2 { animation-delay: .3s; } .d3 { animation-delay: .45s; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  .ink { stroke-dasharray: 1; animation: draw .8s cubic-bezier(.2,.8,.2,1) both; }
  .ink2 { animation-delay: .2s; } .ink3 { animation-delay: .4s; }
  @keyframes draw { from { stroke-dashoffset: 1; } }
  .loop { animation-duration: 9s; animation-iteration-count: infinite; animation-timing-function: ease; }
  .num { opacity: 0; } .n0 { opacity: 1; }
  .bar { transform-box: fill-box; transform-origin: 0 50%; transform: scaleX(0.39); animation-name: bar;
          animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  @keyframes bar { 0%, 20% { transform: scaleX(0.39); } 25%, 34% { transform: scaleX(0.77); }
                    39%, 48% { transform: scaleX(0.93); } 53%, 93% { transform: scaleX(1.0); }
                    98%, 100% { transform: scaleX(0.39); } }
  .chk { opacity: 0; transform-box: fill-box; transform-origin: center; }
  .tick { stroke-dasharray: 1; stroke-dashoffset: 1; }
  .strike { transform-box: fill-box; transform-origin: 0 50%; transform: scaleX(0); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  .n0 { animation-name: n0; } @keyframes n0 { 0%, 21% { opacity: 1; } 23%, 96% { opacity: 0; } 98%, 100% { opacity: 1; } }
  .n1 { animation-name: n1; } @keyframes n1 { 0%, 21% { opacity: 0; } 23%, 35% { opacity: 1; } 37%, 100% { opacity: 0; } }
  .n2 { animation-name: n2; } @keyframes n2 { 0%, 35% { opacity: 0; } 37%, 49% { opacity: 1; } 51%, 100% { opacity: 0; } }
  .n3 { animation-name: n3; } @keyframes n3 { 0%, 49% { opacity: 0; } 51%, 93% { opacity: 1; } 95%, 100% { opacity: 0; } }
  .k0 .chk { animation-name: chk0; animation-timing-function: cubic-bezier(.2,.9,.3,1.4); }
  @keyframes chk0 { 0%, 21% { opacity: 0; transform: scale(.4); } 24% { opacity: 1; transform: scale(1.15); }
                      26%, 93% { opacity: 1; transform: scale(1); } 97%, 100% { opacity: 0; transform: scale(1); } }
  .k0 .tick { animation-name: tick0; }
  @keyframes tick0 { 0%, 23% { stroke-dashoffset: 1; } 26%, 93% { stroke-dashoffset: 0; } 97%, 100% { stroke-dashoffset: 1; } }
  .k0 .strike { animation-name: strike0; }
  @keyframes strike0 { 0%, 22% { transform: scaleX(0); } 26%, 93% { transform: scaleX(1); } 97%, 100% { transform: scaleX(0); } }
  .k0 .face { animation-name: face0; }
  @keyframes face0 { 0%, 22% { fill: #1e232c; } 25%, 93% { fill: #12151b; } 97%, 100% { fill: #1e232c; } }
  .k0 .txt { animation-name: txt0; }
  @keyframes txt0 { 0%, 22% { opacity: 1; } 25%, 93% { opacity: .5; } 97%, 100% { opacity: 1; } }
  .k1 .chk { animation-name: chk1; animation-timing-function: cubic-bezier(.2,.9,.3,1.4); }
  @keyframes chk1 { 0%, 35% { opacity: 0; transform: scale(.4); } 38% { opacity: 1; transform: scale(1.15); }
                      40%, 93% { opacity: 1; transform: scale(1); } 97%, 100% { opacity: 0; transform: scale(1); } }
  .k1 .tick { animation-name: tick1; }
  @keyframes tick1 { 0%, 37% { stroke-dashoffset: 1; } 40%, 93% { stroke-dashoffset: 0; } 97%, 100% { stroke-dashoffset: 1; } }
  .k1 .strike { animation-name: strike1; }
  @keyframes strike1 { 0%, 36% { transform: scaleX(0); } 40%, 93% { transform: scaleX(1); } 97%, 100% { transform: scaleX(0); } }
  .k1 .face { animation-name: face1; }
  @keyframes face1 { 0%, 36% { fill: #1e232c; } 39%, 93% { fill: #12151b; } 97%, 100% { fill: #1e232c; } }
  .k1 .txt { animation-name: txt1; }
  @keyframes txt1 { 0%, 36% { opacity: 1; } 39%, 93% { opacity: .5; } 97%, 100% { opacity: 1; } }
  .k2 .chk { animation-name: chk2; animation-timing-function: cubic-bezier(.2,.9,.3,1.4); }
  @keyframes chk2 { 0%, 49% { opacity: 0; transform: scale(.4); } 52% { opacity: 1; transform: scale(1.15); }
                      54%, 93% { opacity: 1; transform: scale(1); } 97%, 100% { opacity: 0; transform: scale(1); } }
  .k2 .tick { animation-name: tick2; }
  @keyframes tick2 { 0%, 51% { stroke-dashoffset: 1; } 54%, 93% { stroke-dashoffset: 0; } 97%, 100% { stroke-dashoffset: 1; } }
  .k2 .strike { animation-name: strike2; }
  @keyframes strike2 { 0%, 50% { transform: scaleX(0); } 54%, 93% { transform: scaleX(1); } 97%, 100% { transform: scaleX(0); } }
  .k2 .face { animation-name: face2; }
  @keyframes face2 { 0%, 50% { fill: #1e232c; } 53%, 93% { fill: #12151b; } 97%, 100% { fill: #1e232c; } }
  .k2 .txt { animation-name: txt2; }
  @keyframes txt2 { 0%, 50% { opacity: 1; } 53%, 93% { opacity: .5; } 97%, 100% { opacity: 1; } }
  </style>
