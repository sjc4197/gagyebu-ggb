name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: >
          pyinstaller --onefile --name ggb
          --add-data "static;static"
          --collect-submodules uvicorn
          --icon assets/ggb.ico
          server.py

      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process dist/ggb.exe -ArgumentList "--no-browser" -PassThru
          Start-Sleep -Seconds 8
          $r = Invoke-WebRequest http://127.0.0.1:8765/api/categories -UseBasicParsing
          Stop-Process -Id $p.Id
          if ($r.StatusCode -ne 200) { exit 1 }

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/ggb.exe, README.md, LICENSE -DestinationPath ggb-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ggb-windows
          path: ggb-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ggb-windows.zip
          generate_release_notes: true
